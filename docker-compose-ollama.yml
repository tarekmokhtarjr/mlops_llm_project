services:
  # --------------------------------------------------
  # Application infrastructure
  # --------------------------------------------------

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-db
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    networks:
      - rag-net

  # --------------------------------------------------
  # Ollama model server
  # --------------------------------------------------
  # Runs the chat, embedding, and guard models inside
  # the Compose stack. No host Ollama installation is
  # required.
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      # Host-side ingestion and API access use this port.
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    networks:
      - rag-net
    # Uncomment to expose an NVIDIA GPU to Ollama. This
    # requires the NVIDIA Container Toolkit on the host.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # --------------------------------------------------
  # One-shot model pull
  # --------------------------------------------------
  # Ensures the required models exist in the Ollama
  # volume before rag-app starts. Re-running it is cheap
  # because Ollama skips models that are already present.
  ollama-pull:
    image: ollama/ollama:latest
    container_name: ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
      OLLAMA_PULL_MODELS: ${OLLAMA_PULL_MODELS:-true}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:0.5b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-Qwen3-Embedding:0.6b}
      OLLAMA_GUARD_MODEL: ${OLLAMA_GUARD_MODEL:-sileader/qwen3guard:0.6b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if [ "$$OLLAMA_PULL_MODELS" != "true" ]; then
          echo "OLLAMA_PULL_MODELS is not true; skipping model pulls."
          exit 0
        fi
        for model in \
          "$$OLLAMA_CHAT_MODEL" \
          "$$OLLAMA_EMBEDDING_MODEL" \
          "$$OLLAMA_GUARD_MODEL"; do
          echo "Ensuring Ollama model: $$model"
          ollama pull "$$model"
        done
    restart: "no"
    networks:
      - rag-net

  rag-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-app
    env_file:
      - .env
    # Model endpoints resolve to the Ollama container on
    # the shared Compose network.
    environment:
      CHATBOT_SERVER: http://ollama
      CHATBOT_SERVER_PORT: "11434"
      CHATBOT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:0.5b}
      CHATBOT_API_KEY: ollama
      EMBEDDING_MODEL_SERVER: http://ollama
      EMBEDDING_MODEL_SERVER_PORT: "11434"
      EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-Qwen3-Embedding:0.6b}
      EMBEDDING_MODEL_API_KEY: ollama
      EMBEDDING_CHECK_CTX_LENGTH: "false"
      GUARD_MODEL_SERVER: http://ollama
      GUARD_MODEL_SERVER_PORT: "11434"
      # Qwen3Guard is community-packaged in Ollama; no official library tag exists.
      GUARD_MODEL: ${OLLAMA_GUARD_MODEL:-sileader/qwen3guard:0.6b}
      GUARD_MODEL_API_KEY: ollama
    depends_on:
      qdrant:
        condition: service_started
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    volumes:
      - .src/app/evaluation/datasets:/app/evaluation/datasets:ro
    ports:
      - "${STREAMLIT_PORT}:${STREAMLIT_PORT}"
    command:
      - sh
      - -c
      - >
        uv run streamlit run ${STREAMLIT_APP_PATH}
        --server.address=${STREAMLIT_URL}
        --server.port=${STREAMLIT_PORT}
    restart: unless-stopped
    networks:
      - rag-net


# ----------------------------------------------------
# Persistent volumes
# ----------------------------------------------------

volumes:

  mlflow_data:
    name: rag_mlflow_data

  ollama_models:
    name: rag_ollama_models


# ----------------------------------------------------
# Shared network
# ----------------------------------------------------

networks:
  rag-net:
    name: rag-net
    driver: bridge
