
x-langfuse-common-env: &langfuse-common-env
  NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
  DATABASE_URL: postgresql://${LANGFUSE_POSTGRES_USER:-langfuse}:${LANGFUSE_POSTGRES_PASSWORD:?Set LANGFUSE_POSTGRES_PASSWORD in .env}@langfuse-postgres:5432/langfuse
  SALT: ${LANGFUSE_SALT:?Set LANGFUSE_SALT in .env}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?Set LANGFUSE_ENCRYPTION_KEY in .env}
  TELEMETRY_ENABLED: "false"

  CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
  CLICKHOUSE_URL: http://langfuse-clickhouse:8123
  CLICKHOUSE_USER: langfuse
  CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?Set LANGFUSE_CLICKHOUSE_PASSWORD in .env}
  CLICKHOUSE_CLUSTER_ENABLED: "false"

  REDIS_HOST: langfuse-redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD:?Set LANGFUSE_REDIS_PASSWORD in .env}
  REDIS_TLS_ENABLED: "false"

  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_MINIO_USER:-langfuse}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:?Set LANGFUSE_MINIO_PASSWORD in .env}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"

  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_MINIO_USER:-langfuse}
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:?Set LANGFUSE_MINIO_PASSWORD in .env}
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"

  LANGFUSE_S3_BATCH_EXPORT_BUCKET: langfuse
  LANGFUSE_S3_BATCH_EXPORT_PREFIX: exports/
  LANGFUSE_S3_BATCH_EXPORT_REGION: auto
  LANGFUSE_S3_BATCH_EXPORT_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_BATCH_EXPORT_EXTERNAL_ENDPOINT: http://localhost:9090
  LANGFUSE_S3_BATCH_EXPORT_ACCESS_KEY_ID: ${LANGFUSE_MINIO_USER:-langfuse}
  LANGFUSE_S3_BATCH_EXPORT_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:?Set LANGFUSE_MINIO_PASSWORD in .env}
  LANGFUSE_S3_BATCH_EXPORT_FORCE_PATH_STYLE: "true"

services:
  # --------------------------------------------------
  # Existing application infrastructure
  # --------------------------------------------------

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-db
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - rag-net

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.0
    container_name: mlflow
    restart: unless-stopped
    ports:
      - "${MLFLOW_PORT}:${MLFLOW_PORT}"
    volumes:
      - mlflow_data:/mlruns
    command:
      - mlflow
      - server
      - --host
      - "0.0.0.0"
      - --port
      - "${MLFLOW_PORT}"
      - --backend-store-uri
      - "${MLFLOW_BACKEND_STORE_URI}"
      - --default-artifact-root
      - "${MLFLOW_ARTIFACT_LOCATION}"
      - --allowed-hosts
      - "${MLFLOW_ALLOWED_HOSTS}"
    networks:
      - rag-net

  rag-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-app
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .src/app/evaluation/datasets:/app/evaluation/datasets:ro
    ports:
      - "${STREAMLIT_PORT}:${STREAMLIT_PORT}"
    command:
      - sh
      - -c
      - >
        uv run streamlit run ${STREAMLIT_APP_PATH}
        --server.address=${STREAMLIT_URL}
        --server.port=${STREAMLIT_PORT}
    restart: unless-stopped
    networks:
      - rag-net

  llm_guard:
    image: vllm/vllm-openai-cpu:v0.29.0
    container_name: qwen3-guard
    restart: unless-stopped
    ports:
      - "8002:8000"
    volumes:
      - hf_cache:/root/.cache/huggingface
    environment:
      VLLM_CPU_KVCACHE_SPACE: "2"
      VLLM_ENABLE_V1_MULTIPROCESSING: "0"
      VLLM_LOGGING_LEVEL: "INFO"
    cpuset: "0-7"
    command:
      - "Qwen/Qwen3Guard-Gen-0.6B"
      - "--served-model-name"
      - "Qwen/Qwen3Guard-Gen-0.6B"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--max-model-len"
      - "10000"
    security_opt:
      - seccomp=unconfined
    cap_add:
      - SYS_NICE
    networks:
      - rag-net

  embedding:
    image: vllm/vllm-openai-cpu:v0.29.0
    container_name: qwen3-embedding
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - hf_cache:/root/.cache/huggingface
    environment:
      VLLM_CPU_KVCACHE_SPACE: "1"
      VLLM_ENABLE_V1_MULTIPROCESSING: "0"
      VLLM_LOGGING_LEVEL: "INFO"
    cpuset: "0-7"
    command:
      - "Qwen/Qwen3-Embedding-0.6B"
      - "--served-model-name"
      - "Qwen/Qwen3-Embedding-0.6B"
      - "--runner"
      - "pooling"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--max-model-len"
      - "2048"
    security_opt:
      - seccomp=unconfined
    cap_add:
      - SYS_NICE
    networks:
      - rag-net

  llm:
    image: vllm/vllm-openai-cpu:v0.29.0
    container_name: qwen2.5-0.5b
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - hf_cache:/root/.cache/huggingface
    environment:
      VLLM_CPU_KVCACHE_SPACE: "1"
      VLLM_LOGGING_LEVEL: "INFO"
    cpuset: "8-23"
    command:
      - "Qwen/Qwen2.5-0.5B-Instruct"
      - "--served-model-name"
      - "Qwen/Qwen2.5-0.5B-Instruct"
      - "--dtype"
      - "bfloat16"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--max-model-len"
      - "10000"
      - "--gpu-memory-utilization"
      - "0.95"
    security_opt:
      - seccomp=unconfined
    cap_add:
      - SYS_NICE
    shm_size: "2g"
    networks:
      - rag-net

  # --------------------------------------------------
  # Langfuse v4
  # --------------------------------------------------

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4
    restart: unless-stopped
    depends_on: &langfuse-depends-on
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      <<: *langfuse-common-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?Set LANGFUSE_NEXTAUTH_SECRET in .env}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9090
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://langfuse-minio:9000
    networks:
      - rag-net

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    restart: unless-stopped
    depends_on: *langfuse-depends-on
    environment:
      <<: *langfuse-common-env
    networks:
      - rag-net

  langfuse-postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LANGFUSE_POSTGRES_USER:-langfuse}
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:?Set LANGFUSE_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: langfuse
      TZ: UTC
      PGTZ: UTC
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - rag-net

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:25.12
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?Set LANGFUSE_CLICKHOUSE_PASSWORD in .env}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - rag-net

  langfuse-redis:
    image: redis:7
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${LANGFUSE_REDIS_PASSWORD:?Set LANGFUSE_REDIS_PASSWORD in .env}
      - --maxmemory-policy
      - noeviction
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${LANGFUSE_REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      LANGFUSE_REDIS_PASSWORD: ${LANGFUSE_REDIS_PASSWORD:?Set LANGFUSE_REDIS_PASSWORD in .env}
    networks:
      - rag-net

  langfuse-minio:
    image: cgr.dev/chainguard/minio
    restart: unless-stopped
    entrypoint: sh
    command:
      - -c
      - mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data
    environment:
      MINIO_ROOT_USER: ${LANGFUSE_MINIO_USER:-langfuse}
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_PASSWORD:?Set LANGFUSE_MINIO_PASSWORD in .env}
    ports:
      - "9090:9000"
      - "127.0.0.1:9091:9001"
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - rag-net

# ----------------------------------------------------
# Persistent volumes
# ----------------------------------------------------

volumes:
  qdrant_storage:
    name: rag_qdrant_storage

  hf_cache:
    name: rag_hf_cache

  mlflow_data:
    name: rag_mlflow_data

  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_redis_data:
  langfuse_minio_data:

# ----------------------------------------------------
# Shared network
# ----------------------------------------------------

networks:
  rag-net:
    name: rag-net
    driver: bridge
